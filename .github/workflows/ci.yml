name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.95.0 fmt --all --check
      - run: cargo +1.95.0 clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo +1.95.0 test --locked --no-default-features
      - run: cargo +1.95.0 test --locked --all-features

  libass:
    name: libass rendering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y libass-dev fonts-noto-cjk
      - run: cargo +1.95.0 test --locked --test libass -- --ignored
